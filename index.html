<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyric Technique Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Lyric Technique Visualizer</h1>
            <div class="song-meta">
                <input type="text" id="song-title" placeholder="曲名を入力...">
            </div>
            <div class="controls">
                <button id="export-btn">エクスポート (.txt)</button>
                <label class="btn-label">
                    インポート (.txt)
                    <input type="file" id="import-input" accept=".txt" hidden>
                </label>
            </div>
        </header>

        <main>
            <section class="editor-section">
                <h2>エディタ</h2>
                <div class="input-container">
                    <textarea id="main-editor" placeholder="歌詞を入力してください... (例: あ~い~う^え^お)"></textarea>
                </div>
                <div class="settings" id="tech-settings">
                    <div class="settings-header">
                        <h3>テクニック設定</h3>
                        <button id="add-tech-btn" class="btn-small">+ 追加</button>
                    </div>
                    <div id="tech-list">
                        <!-- 動的に生成 -->
                    </div>
                </div>

                <!-- テクニック追加用モーダル/フォーム（簡易） -->
                <div id="tech-modal" class="modal" style="display:none;">
                    <div class="modal-content">
                        <h4>テクニックの追加</h4>
                        <div class="form-group">
                            <label>名前 (例: ブレス):</label>
                            <input type="text" id="new-tech-label" placeholder="名前">
                        </div>
                        <div class="form-group">
                            <label>使用記号 (1文字):</label>
                            <input type="text" id="new-tech-char" maxlength="1" placeholder="!">
                        </div>
                        <div class="form-group">
                            <label>タイプ:</label>
                            <select id="new-tech-type">
                                <option value="range">範囲指定 (!...!)</option>
                                <option value="single">単一文字 (!)</option>
                            </select>
                        </div>
                        <div id="new-tech-extra-fields">
                            <!-- typeに応じて動的に変更 -->
                        </div>
                        <div class="modal-actions">
                            <button id="save-tech-btn">保存</button>
                            <button id="cancel-tech-btn">キャンセル</button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="preview-section">
                <h2>プレビュー</h2>
                <div id="preview-area" class="preview-area">
                    <!-- 動的に生成 -->
                </div>
            </section>
        </main>

        <footer>
            <div class="legend">
                <h3>ショートカット記法</h3>
                <ul>
                    <li><code>~...~</code> : ビブラート</li>
                    <li><code>-...-</code> : ウィスパー</li>
                    <li><code>^...^</code> : 裏声</li>
                    <li><code>:...:</code> : エッジ</li>
                    <li><code>'</code> : しゃくり (直前の文字)</li>
                    <li><code>"</code> : フォール (直前の文字)</li>
                </ul>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
